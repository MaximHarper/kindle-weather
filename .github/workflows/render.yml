name: Render dashboard

on:
  schedule:
    - cron: "7,37 * * * *"   # every half hour (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write             # to publish the image to the `dashboard` branch
  actions: write              # to keep the schedule from being auto-disabled

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Render
        run: |
          mkdir -p out
          python render.py --out out/dashboard.png --preview out/preview.png

      - name: Publish to the dashboard branch
        # One orphan commit, force-pushed each time, so the history never grows.
        run: |
          cd out
          git init -q -b dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.png preview.png
          git commit -q -m "Dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dashboard

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repo activity.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || true
